<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microservices E-Commerce</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
    header { background: #17202a; color: white; padding: 20px; }
    header h1 { margin: 0 0 6px; }
    main { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .card, .panel { background: white; border-radius: 10px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .price { font-size: 20px; font-weight: bold; margin: 10px 0; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer; background: #2563eb; color: white; }
    input { padding: 10px; margin: 5px 0; width: 100%; border: 1px solid #ccc; border-radius: 6px; }
    #status { margin: 15px 0; padding: 10px; background: #e8f0fe; border-radius: 6px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
<header>
  <h1>Microservices E-Commerce</h1>
  <div>Frontend → NGINX Ingress → Gateway → Microservices</div>
</header>
<main>
  <div id="status">Loading products...</div>

  <section class="panel">
    <h2>Login</h2>
    <input id="username" value="alice" placeholder="Username">
    <input id="password" type="password" value="password123" placeholder="Password">
    <button onclick="login()">Login</button>
    <span id="loginStatus"></span>
  </section>

  <h2>Products</h2>
  <section id="products" class="grid"></section>

  <section class="panel" style="margin-top:25px">
    <h2>Cart</h2>
    <button onclick="loadCart()">Refresh Cart</button>
    <pre id="cart"></pre>
  </section>

  <section class="panel" style="margin-top:25px">
    <h2>Orders</h2>
    <button onclick="loadOrders()">Refresh Orders</button>
    <pre id="orders"></pre>
  </section>
</main>
<script>
let currentUser = "alice";

async function api(url, options = {}) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

async function loadProducts() {
  try {
    const products = await api("/products");
    document.getElementById("status").textContent = "Gateway and Product service are working.";
    document.getElementById("products").innerHTML = products.map(p => `
      <div class="card">
        <h3>${p.name}</h3>
        <div class="price">$${Number(p.price).toFixed(2)}</div>
        <button onclick="addToCart(${p.id})">Add to cart</button>
      </div>`).join("");
  } catch (e) {
    document.getElementById("status").textContent = "API error: " + e.message;
  }
}

async function login() {
  try {
    const data = await api("/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });
    currentUser = data.user;
    document.getElementById("loginStatus").textContent = " Logged in as " + currentUser;
    loadCart();
  } catch (e) {
    document.getElementById("loginStatus").textContent = " " + e.message;
  }
}

async function addToCart(id) {
  try {
    await api(`/cart/${currentUser}/add`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({item:{id, qty:1}})
    });
    await loadCart();
  } catch (e) { alert(e.message); }
}

async function loadCart() {
  try {
    const cart = await api(`/cart/${currentUser}`);
    document.getElementById("cart").textContent = JSON.stringify(cart, null, 2);
  } catch (e) { document.getElementById("cart").textContent = e.message; }
}

async function loadOrders() {
  try {
    const orders = await api(`/orders?user=${encodeURIComponent(currentUser)}`);
    document.getElementById("orders").textContent = JSON.stringify(orders, null, 2);
  } catch (e) { document.getElementById("orders").textContent = e.message; }
}

loadProducts();
loadCart();
loadOrders();
</script>
</body>
</html>
